# ============================================================
# Experimento 008: Threshold Tuning
# ============================================================
# Descripción: Búsqueda del mejor umbral de clasificación
#              usando los mejores hiperparámetros de exp005_tuning.
#              
# Objetivo: Encontrar el umbral que mejor se adapte al
#           objetivo de negocio (maximizar recall o F1).
#              
# Mejores params de tuning (tuning_run_004):
#   - learning_rate: 0.05
#   - max_depth: 4
#   - n_estimators: 500
#   - colsample_bytree: 0.8
#   - subsample: 0.8
#   - ROC AUC (CV): 0.7703
#
# Grid de umbrales: 0.10 a 0.40 (paso 0.05)
# ============================================================

experiment:
  name: "exp008_threshold_tuning"
  description: "Threshold tuning con XGBoost optimizado"
  version: "1.0"
  author: "Home Credit Team"
  source: "exp005_tuning + exp007"

# ------------------------------------------------------------
# Datos
# ------------------------------------------------------------
data:
  dataset: "application_train_preprocessed.csv"
  features_file: "features_route_b.txt"  # 109 features
  target: "TARGET"
  id_column: "SK_ID_CURR"
  
  test_size: 0.2
  random_state: 42
  stratify: true

# ------------------------------------------------------------
# Modelo — Mejores hiperparámetros de exp005_tuning
# ------------------------------------------------------------
model:
  name: "xgboost.XGBClassifier"
  description: "XGBoost con params óptimos del tuning"
  
  params:
    n_estimators: 500        # de tuning_run_004
    max_depth: 4             # de tuning_run_004
    learning_rate: 0.05      # de tuning_run_004
    subsample: 0.8           # de tuning_run_004
    colsample_bytree: 0.8    # de tuning_run_004
    scale_pos_weight: 11.38  # ratio = 282686/24825
    random_state: 42
    n_jobs: -1
    eval_metric: "auc"

# ------------------------------------------------------------
# Evaluación — Grid de umbrales (OBLIGATORIO)
# ------------------------------------------------------------
evaluation:
  thresholds:
    min: 0.10      # Umbral mínimo a probar
    max: 0.40      # Umbral máximo a probar
    step: 0.05     # Paso entre umbrales

# ------------------------------------------------------------
# MLflow Tracking
# ------------------------------------------------------------
mlflow:
  experiment_name: "home_credit_default"
  
  tags:
    feature_set: "route_b"
    feature_count: 109
    model_type: "gradient_boosting"
    experiment_source: "exp005_tuning"
    tuning_type: "threshold"
