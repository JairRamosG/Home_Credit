# ============================================================
# Experimento 005: Evaluación Final (basado en exp005_tuning)
# ============================================================
# ETAPA 4: Evaluación Final
# Descripción: Evalúa el modelo final en el TEST SET usando
#              los mejores hiperparámetros de exp005_tuning
#              y el mejor threshold de exp005_umbral.
#
# IMPORTANTE: Este script:
#   1. Combina Train + Validation = Nuevo Train (80%)
#   2. Entrena el modelo final con ese 80%
#   3. Evalúa en TEST SET (20%) — evaluación final
#
# El test set es el MISMO que se usó en ETAPA 3.
# ============================================================

experiment:
  name: "exp005_final"
  description: "Evaluación final del modelo XGBoost en TEST SET"
  version: "3.0"
  author: "Jair"
  stage: "etapa_4"
  base_experiment: "exp005_tuning"
  threshold_source: "exp005_umbral"

# ------------------------------------------------------------
# Datos — 3-way split (train/val/test)
# ------------------------------------------------------------
data:
  dataset: "application_train_preprocessed.csv"
  features_file: "features_route_b.txt"  # 109 features
  target: "TARGET"
  id_column: "SK_ID_CURR"
  
  test_size: 0.2          # 20% para test (evaluación final)
  validation_size: 0.2    # 20% para validation (se une con train)
  random_state: 42
  stratify: true

# ------------------------------------------------------------
# Modelo — Mejores hiperparámetros de exp005_tuning
# ------------------------------------------------------------
model:
  name: "xgboost.XGBClassifier"
  description: "XGBoost con mejores hiperparámetros del tuning + threshold 0.1"
  
  params:
    n_estimators: 500        # Mejor valor del tuning
    max_depth: 4             # Mejor valor del tuning
    learning_rate: 0.05      # Mejor valor del tuning
    subsample: 0.8           # Mejor valor del tuning
    colsample_bytree: 0.8    # Mejor valor del tuning
    scale_pos_weight: 11.38  # Balancear clases (92% vs 8%)
    random_state: 42
    n_jobs: -1
    eval_metric: "auc"

# ------------------------------------------------------------
# Evaluación — Threshold fijo de exp005_umbral
# ------------------------------------------------------------
evaluation:
  threshold: 0.1  # Mejor threshold para recall (de exp005_umbral)
  eval_set: "test"  # Evaluación en TEST SET

# ------------------------------------------------------------
# Métricas a evaluar
# ------------------------------------------------------------
metrics:
  primary: "recall"
  
  all:
    - name: "accuracy"
      description: "Exactitud general"
    - name: "precision"
      description: "¿Cuántos predichos como default realmente lo son?"
    - name: "recall"
      description: "¿Cuántos defaults reales detectamos?"
    - name: "f1"
      description: "Balance precision/recall"
    - name: "roc_auc"
      description: "Área bajo la curva ROC"

# ------------------------------------------------------------
# MLflow Tracking
# ------------------------------------------------------------
mlflow:
  experiment_name: "home_credit_default"
  
  tags:
    feature_set: "route_b"
    feature_count: 109
    model_type: "gradient_boosting"
    tuning_method: "grid_search_cv"
    threshold: 0.1
    eval_set: "test"
    notebook_source: "07_feature_selection.ipynb"
    version: "3.0"
    stage: "etapa_4"

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  save_model: true
  model_path: "models/exp005_final.pkl"
  
  save_predictions: true
  predictions_path: "experiments/results/exp005_final_predictions.csv"
  
  save_feature_importance: true
  feature_importance_path: "experiments/results/exp005_final_feature_importance.csv"
