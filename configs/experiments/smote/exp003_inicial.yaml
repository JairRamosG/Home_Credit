# ============================================================
# Experimento 003: XGBoost + Intersección + SMOTE
# ============================================================
# ETAPA 1: Experimentos Iniciales con SMOTE
# Descripción: Gradient Boosting con las 14 features de la
#              intersección (misma que Ruta A). SMOTE para
#              oversampling de clase minoritaria.
# ============================================================

experiment:
  name: "exp003_xgboost_intersection_smote"
  description: "XGBoost con 14 features de intersección + SMOTE"
  version: "1.0"
  author: "Home Credit Team"
  stage: "etapa_1"

# ------------------------------------------------------------
# Datos — 2-way split (train/test)
# ------------------------------------------------------------
data:
  dataset: "application_train_preprocessed.csv"
  features_file: "features_intersection.txt"  # 14 features (igual que route_a)
  target: "TARGET"
  id_column: "SK_ID_CURR"
  
  # Split — 2-way: train (80%) / test (20%)
  test_size: 0.2
  random_state: 42
  stratify: true

# ------------------------------------------------------------
# SMOTE (Imbalanced Learning)
# ------------------------------------------------------------
smote:
  enabled: true
  random_state: 42
  sampling_strategy: 0.5  # Clase minoritaria = 50% de la mayoritaria
  k_neighbors: 5

# ------------------------------------------------------------
# Modelo
# ------------------------------------------------------------
model:
  name: "xgboost.XGBClassifier"
  description: "XGBoost con scale_pos_weight + SMOTE"
  
  params:
    n_estimators: 200
    max_depth: 6              # Menor que RF (XGBoost es más propenso a overfitting)
    learning_rate: 0.1        # Tasa de aprendizaje
    subsample: 0.8            # Submuestreo de filas
    colsample_bytree: 0.8     # Submuestreo de columnas
    scale_pos_weight: 11.38   # Mantener para compatibilidad
    random_state: 42
    n_jobs: -1
    eval_metric: "auc"

# ------------------------------------------------------------
# Métricas a evaluar
# ------------------------------------------------------------
metrics:
  primary: "recall"  # Métrica principal: detectar defaults
  
  all:
    - name: "accuracy"
      description: "Exactitud general"
    - name: "precision"
      description: "¿Cuántos predichos como default realmente lo son?"
    - name: "recall"
      description: "¿Cuántos defaults reales detectamos?"
    - name: "f1"
      description: "Balance precision/recall"
    - name: "roc_auc"
      description: "Área bajo la curva ROC (principal)"

# ------------------------------------------------------------
# MLflow Tracking
# ------------------------------------------------------------
mlflow:
  experiment_name: "home_credit_default"
  
  tags:
    feature_set: "intersection"
    feature_count: 14
    model_type: "gradient_boosting"
    smote_enabled: true
    notebook_source: "07_feature_selection.ipynb"
    version: "1.0"
    stage: "etapa_1"
    primary_metric: "recall"

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  save_model: true
  model_path: "models/exp003_xgboost_intersection_smote.pkl"
  
  save_predictions: true
  predictions_path: "experiments/results/exp003_smote_predictions.csv"
  
  save_feature_importance: true
  feature_importance_path: "experiments/results/exp003_smote_feature_importance.csv"
