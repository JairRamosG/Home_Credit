# ============================================================
# Experimento 015: XGBoost + Top 50 Features + SMOTE (Route B)
# ============================================================
# Descripción: XGBoost con las 50 features más importantes
#              de Ruta B. SMOTE para oversampling de clase minoritaria.
#              Mismos hiperparámetros que exp005.
# ============================================================

experiment:
  name: "exp015_xgboost_top50_smote"
  description: "XGBoost con 50 features top de Route B + SMOTE"
  version: "1.0"
  author: "Home Credit Team"

# ------------------------------------------------------------
# Datos
# ------------------------------------------------------------
data:
  dataset: "application_train_preprocessed.csv"
  features_file: "features_top50.txt"  # 50 features
  target: "TARGET"
  id_column: "SK_ID_CURR"
  
  test_size: 0.2
  random_state: 42
  stratify: true

# ------------------------------------------------------------
# SMOTE (Imbalanced Learning)
# ------------------------------------------------------------
smote:
  enabled: true
  random_state: 42
  sampling_strategy: 0.5  # Clase minoritaria = 50% de la mayoritaria
  k_neighbors: 5

# ------------------------------------------------------------
# Modelo
# ------------------------------------------------------------
model:
  name: "xgboost.XGBClassifier"
  description: "XGBoost con scale_pos_weight para desbalanceo + SMOTE"
  
  params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    scale_pos_weight: 11.38   # ratio = 282686/24825
    random_state: 42
    n_jobs: -1
    eval_metric: "auc"

# ------------------------------------------------------------
# Métricas a evaluar
# ------------------------------------------------------------
metrics:
  primary: "roc_auc"
  
  all:
    - name: "accuracy"
      description: "Exactitud general"
    - name: "precision"
      description: "¿Cuántos predichos como default realmente lo son?"
    - name: "recall"
      description: "¿Cuántos defaults reales detectamos?"
    - name: "f1"
      description: "Balance precision/recall"
    - name: "roc_auc"
      description: "Área bajo la curva ROC (principal)"

# ------------------------------------------------------------
# MLflow Tracking
# ------------------------------------------------------------
mlflow:
  experiment_name: "home_credit_default"
  
  tags:
    feature_set: "top50"
    feature_count: 50
    model_type: "gradient_boosting"
    smote_enabled: true
    notebook_source: "07_feature_selection.ipynb"

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  save_model: true
  model_path: "models/exp015_xgboost_top50_smote.pkl"
  
  save_predictions: true
  predictions_path: "experiments/results/exp015_smote_predictions.csv"
  
  save_feature_importance: true
  feature_importance_path: "experiments/results/exp015_smote_feature_importance.csv"
