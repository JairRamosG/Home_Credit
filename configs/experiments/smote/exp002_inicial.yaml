# ============================================================
# Experimento 002: Random Forest + Ruta B + SMOTE
# ============================================================
# ETAPA 1: Experimentos Iniciales con SMOTE
# Descripción: Modelo no lineal con las 109 features que RF
#              considera importantes en contexto multivariado.
#              SMOTE para oversampling de clase minoritaria.
# ============================================================

experiment:
  name: "exp002_random_forest_route_b_smote"
  description: "Random Forest con 109 features de Ruta B + SMOTE"
  version: "1.0"
  author: "Home Credit Team"
  stage: "etapa_1"

# ------------------------------------------------------------
# Datos — 2-way split (train/test)
# ------------------------------------------------------------
data:
  dataset: "application_train_preprocessed.csv"
  features_file: "features_route_b.txt"  # 109 features
  target: "TARGET"
  id_column: "SK_ID_CURR"
  
  # Split — 2-way: train (80%) / test (20%)
  test_size: 0.2
  random_state: 42
  stratify: True

# ------------------------------------------------------------
# SMOTE (Imbalanced Learning)
# ------------------------------------------------------------
smote:
  enabled: true
  random_state: 42
  sampling_strategy: 0.5  # Clase minoritaria = 50% de la mayoritaria
  k_neighbors: 5

# ------------------------------------------------------------
# Modelo
# ------------------------------------------------------------
model:
  name: "sklearn.ensemble.RandomForestClassifier"
  description: "Random Forest con class_weight balanceado + SMOTE"
  
  params:
    n_estimators: 200       # Número de árboles
    max_depth: 10           # Profundidad máxima (evitar overfitting)
    min_samples_split: 10   # Mínimo de muestras para dividir
    min_samples_leaf: 5     # Mínimo de muestras en hoja
    class_weight: "balanced"  # Mantener para compatibilidad
    random_state: 42
    n_jobs: -1              

# ------------------------------------------------------------
# Métricas a evaluar
# ------------------------------------------------------------
metrics:
  primary: "roc_auc"
  
  all:
    - name: "accuracy"
      description: "Exactitud general"
    - name: "precision"
      description: "¿Cuántos predichos como default realmente lo son?"
    - name: "recall"
      description: "¿Cuántos defaults reales detectamos?"
    - name: "f1"
      description: "Balance precision/recall"
    - name: "roc_auc"
      description: "Área bajo la curva ROC (principal)"

# ------------------------------------------------------------
# MLflow Tracking
# ------------------------------------------------------------
mlflow:
  experiment_name: "home_credit_default"
  
  tags:
    feature_set: "route_b"
    feature_count: 109
    model_type: "tree_based"
    smote_enabled: true
    notebook_source: "07_feature_selection.ipynb"
    version: "1.0"
    stage: "etapa_1"

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  save_model: true
  model_path: "models/exp002_random_forest_route_b_smote.pkl"
  
  save_predictions: true
  predictions_path: "experiments/results/exp002_smote_predictions.csv"
  
  save_feature_importance: true  # Guardar importancia de features
  feature_importance_path: "experiments/results/exp002_smote_feature_importance.csv"
