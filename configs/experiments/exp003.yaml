# ============================================================
# Experimento 003: XGBoost + Intersección
# ============================================================
# Descripción: Gradient Boosting con las 14 features de la
#              intersección (misma que Ruta A). Permite comparar
#              modelo no lineal vs lineal (exp001) con mismas features.
# ============================================================

experiment:
  name: "exp003_xgboost_intersection"
  description: "XGBoost con 14 features de intersección (Route A ∩ Route B)"
  version: "1.0"
  author: "Jair"

# ------------------------------------------------------------
# Datos
# ------------------------------------------------------------
data:
  dataset: "application_train_preprocessed.csv"
  features_file: "features_intersection.txt"  # 14 features (igual que route_a)
  target: "TARGET"
  id_column: "SK_ID_CURR"
  
  test_size: 0.2
  random_state: 42
  stratify: true

# ------------------------------------------------------------
# Modelo
# ------------------------------------------------------------
model:
  name: "xgboost.XGBClassifier"
  description: "XGBoost con scale_pos_weight para desbalanceo"
  
  params:
    n_estimators: 200
    max_depth: 6              # Menor que RF (XGBoost es más propenso a overfitting)
    learning_rate: 0.1        # Tasa de aprendizaje
    subsample: 0.8            # Submuestreo de filas
    colsample_bytree: 0.8     # Submuestreo de columnas
    scale_pos_weight: 11.38   # ratio = 282686/24825 (balancear clases)
    random_state: 42
    n_jobs: -1
    eval_metric: "auc"

# ------------------------------------------------------------
# Métricas a evaluar
# ------------------------------------------------------------
metrics:
  primary: "roc_auc"
  
  all:
    - name: "accuracy"
      description: "Exactitud general"
    - name: "precision"
      description: "¿Cuántos predichos como default realmente lo son?"
    - name: "recall"
      description: "¿Cuántos defaults reales detectamos?"
    - name: "f1"
      description: "Balance precision/recall"
    - name: "roc_auc"
      description: "Área bajo la curva ROC (principal)"

# ------------------------------------------------------------
# MLflow Tracking
# ------------------------------------------------------------
mlflow:
  experiment_name: "home_credit_default"
  
  tags:
    feature_set: "intersection"
    feature_count: 14
    model_type: "gradient_boosting"
    notebook_source: "07_feature_selection.ipynb"

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  save_model: true
  model_path: "models/exp003_xgboost_intersection.pkl"
  
  save_predictions: true
  predictions_path: "experiments/results/exp003_predictions.csv"
  
  save_feature_importance: true
  feature_importance_path: "experiments/results/exp003_feature_importance.csv"
