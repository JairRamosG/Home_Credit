# ============================================================
# Experimento 005: Ajuste de Umbral (basado en exp005_tuning)
# ============================================================
# ETAPA 3: Ajuste de Umbral
# Descripción: Busca el mejor threshold de clasificación para
#              maximizar recall usando el validation set.
#              Basado en los mejores hiperparámetros de exp005_tuning.
#
# IMPORTANTE: Este script usa el VALIDATION SET para buscar el umbral.
#             El test se reserva para ETAPA 4 (evaluación final).
# ============================================================

experiment:
  name: "exp005_umbral"
  description: "Ajuste de umbral para maximizar recall — basado en exp005_tuning"
  version: "3.0"
  author: "Jair"
  stage: "etapa_3"
  base_experiment: "exp005_tuning"

# ------------------------------------------------------------
# Datos — 3-way split (train/val/test)
# ------------------------------------------------------------
data:
  dataset: "application_train_preprocessed.csv"
  features_file: "features_route_b.txt"  # 109 features (mismo que exp005)
  target: "TARGET"
  id_column: "SK_ID_CURR"
  
  test_size: 0.2          # 20% para test (ETAPA 4)
  validation_size: 0.2    # 20% para validation (ETAPA 3)
  random_state: 42
  stratify: true

# ------------------------------------------------------------
# Modelo — Mejores hiperparámetros de exp005_tuning
# ------------------------------------------------------------
model:
  name: "xgboost.XGBClassifier"
  description: "XGBoost con mejores hiperparámetros del tuning"
  
  params:
    n_estimators: 500        # Mejor valor del tuning
    max_depth: 4             # Mejor valor del tuning
    learning_rate: 0.05      # Mejor valor del tuning
    subsample: 0.8           # Mejor valor del tuning
    colsample_bytree: 0.8    # Mejor valor del tuning
    scale_pos_weight: 11.38  # Balancear clases (92% vs 8%)
    random_state: 42
    n_jobs: -1
    eval_metric: "auc"

# ------------------------------------------------------------
# Threshold Tuning
# ------------------------------------------------------------
evaluation:
  # Grid de umbrales a probar
  thresholds:
    min: 0.10
    max: 0.50
    step: 0.05
  
  # Métrica principal para elegir mejor umbral
  primary_metric: "recall"

# ------------------------------------------------------------
# Métricas a evaluar
# ------------------------------------------------------------
metrics:
  primary: "recall"
  
  all:
    - name: "accuracy"
      description: "Exactitud general"
    - name: "precision"
      description: "¿Cuántos predichos como default realmente lo son?"
    - name: "recall"
      description: "¿Cuántos defaults reales detectamos?"
    - name: "f1"
      description: "Balance precision/recall"
    - name: "roc_auc"
      description: "Área bajo la curva ROC"

# ------------------------------------------------------------
# MLflow Tracking
# ------------------------------------------------------------
mlflow:
  experiment_name: "home_credit_default"
  
  tags:
    feature_set: "route_b"
    feature_count: 109
    model_type: "gradient_boosting"
    tuning_method: "threshold_search"
    eval_set: "validation"
    notebook_source: "07_feature_selection.ipynb"
    version: "3.0"
    stage: "etapa_3"

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  save_model: true
  model_path: "models/exp005_umbral.pkl"
  
  save_predictions: true
  predictions_path: "experiments/results/exp005_umbral_predictions.csv"
  
  save_threshold_results: true
  threshold_results_path: "experiments/results/exp005_threshold_results.csv"
