# ============================================================
# Experimento 007: XGBoost optimizado + Umbral ajustado
# ============================================================
# Descripción: XGBoost con los mejores hiperparámetros encontrados
#              en exp005_tuning + threshold ajustado para mejorar recall.
#              
# Mejores params de tuning (tuning_run_004):
#   - learning_rate: 0.05
#   - max_depth: 4
#   - n_estimators: 500
#   - colsample_bytree: 0.8
#   - subsample: 0.8
#   - ROC AUC (CV): 0.7703
# ============================================================

experiment:
  name: "exp007_xgb_optimized_threshold"
  description: "XGBoost optimizado con threshold ajustado para mejorar recall"
  version: "1.0"
  author: "Home Credit Team"
  source: "exp005_tuning (mejor run: tuning_run_004)"

# ------------------------------------------------------------
# Datos
# ------------------------------------------------------------
data:
  dataset: "application_train_preprocessed.csv"
  features_file: "features_route_b.txt"  # 109 features (misma que exp005)
  target: "TARGET"
  id_column: "SK_ID_CURR"
  
  test_size: 0.2
  random_state: 42
  stratify: true

# ------------------------------------------------------------
# Modelo — Mejores hiperparámetros de exp005_tuning
# ------------------------------------------------------------
model:
  name: "xgboost.XGBClassifier"
  description: "XGBoost con params óptimos del tuning + class_weight para desbalanceo"
  
  params:
    n_estimators: 500        # de tuning_run_004
    max_depth: 4             # de tuning_run_004
    learning_rate: 0.05      # de tuning_run_004
    subsample: 0.8           # de tuning_run_004
    colsample_bytree: 0.8    # de tuning_run_004
    scale_pos_weight: 11.38  # ratio = 282686/24825 (manejo de desbalanceo)
    random_state: 42
    n_jobs: -1
    eval_metric: "auc"

# ------------------------------------------------------------
# Evaluación — Threshold ajustado
# ------------------------------------------------------------
evaluation:
  threshold: 0.3  # Bajar de 0.5 a 0.3 para mejorar recall

# ------------------------------------------------------------
# Métricas a evaluar
# ------------------------------------------------------------
metrics:
  primary: "roc_auc"
  
  all:
    - name: "accuracy"
      description: "Exactitud general"
    - name: "precision"
      description: "¿Cuántos predichos como default realmente lo son?"
    - name: "recall"
      description: "¿Cuántos defaults reales detectamos?"
    - name: "f1"
      description: "Balance precision/recall"
    - name: "roc_auc"
      description: "Área bajo la curva ROC (principal)"

# ------------------------------------------------------------
# MLflow Tracking
# ------------------------------------------------------------
mlflow:
  experiment_name: "home_credit_default"
  
  tags:
    feature_set: "route_b"
    feature_count: 109
    model_type: "gradient_boosting"
    experiment_source: "exp005_tuning"
    tuning_run: "tuning_run_004"
    notebook_source: "07_feature_selection.ipynb"

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  save_model: true
  model_path: "models/exp007_xgb_optimized_threshold.pkl"
  
  save_predictions: true
  predictions_path: "experiments/results/exp007_predictions.csv"
  
  save_feature_importance: true
  feature_importance_path: "experiments/results/exp007_feature_importance.csv"
