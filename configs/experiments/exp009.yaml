# ============================================================
# Experimento 009: Evaluación Final en TEST SET
# ============================================================
# Descripción: Evaluación final del mejor modelo en el TEST SET.
#              Pipeline completo:
#              1. tune_experiment → Train + CV (mejores params)
#              2. tune_threshold → Validation (mejor threshold)
#              3. run_experiment → TEST SET (evaluación final)
#
# Mejores params de tuning (tuning_run_004):
#   - learning_rate: 0.05
#   - max_depth: 4
#   - n_estimators: 500
#   - colsample_bytree: 0.8
#   - subsample: 0.8
#   - ROC AUC (CV): 0.7703
#
# Mejor threshold de tune_threshold (exp008):
#   - threshold: 0.3 → recall=0.8953
#
# IMPORTANTE: Este script evalúa en el TEST SET (evaluación final).
# ============================================================

experiment:
  name: "exp009_final_evaluation"
  description: "Evaluación final del mejor modelo en TEST SET"
  version: "1.0"
  author: "Home Credit Team"
  source: "exp005_tuning + exp008_threshold"

# ------------------------------------------------------------
# Datos — 3-way split
# ------------------------------------------------------------
data:
  dataset: "application_train_preprocessed.csv"
  features_file: "features_route_b.txt"  # 109 features
  target: "TARGET"
  id_column: "SK_ID_CURR"
  
  test_size: 0.2          # 20% para test final
  validation_size: 0.2    # 20% para validation (de train)
  random_state: 42
  stratify: true

# ------------------------------------------------------------
# Modelo — Mejores hiperparámetros de exp005_tuning
# ------------------------------------------------------------
model:
  name: "xgboost.XGBClassifier"
  description: "XGBoost con params óptimos del tuning (tuning_run_004)"
  
  params:
    n_estimators: 500        # de tuning_run_004
    max_depth: 4             # de tuning_run_004
    learning_rate: 0.05      # de tuning_run_004
    subsample: 0.8           # de tuning_run_004
    colsample_bytree: 0.8    # de tuning_run_004
    scale_pos_weight: 11.38  # ratio = 282686/24825 (manejo de desbalanceo)
    random_state: 42
    n_jobs: -1
    eval_metric: "auc"

# ------------------------------------------------------------
# Evaluación — Mejor threshold de tune_threshold
# ------------------------------------------------------------
evaluation:
  threshold: 0.3  # Mejor threshold de exp008 (recall=0.8953)
  eval_set: "test"  # Evaluación final en TEST SET

# ------------------------------------------------------------
# Métricas a evaluar
# ------------------------------------------------------------
metrics:
  primary: "roc_auc"
  
  all:
    - name: "accuracy"
      description: "Exactitud general"
    - name: "precision"
      description: "¿Cuántos predichos como default realmente lo son?"
    - name: "recall"
      description: "¿Cuántos defaults reales detectamos?"
    - name: "f1"
      description: "Balance precision/recall"
    - name: "roc_auc"
      description: "Área bajo la curva ROC (principal)"

# ------------------------------------------------------------
# MLflow Tracking
# ------------------------------------------------------------
mlflow:
  experiment_name: "home_credit_default"
  
  tags:
    feature_set: "route_b"
    feature_count: 109
    model_type: "gradient_boosting"
    experiment_source: "exp005_tuning + exp008_threshold"
    tuning_run: "tuning_run_004"
    threshold_source: "exp008"
    evaluation_set: "test"
    notebook_source: "07_feature_selection.ipynb"

# ------------------------------------------------------------
# Output
# ------------------------------------------------------------
output:
  save_model: true
  model_path: "models/exp009_final_xgb.pkl"
  
  save_predictions: true
  predictions_path: "experiments/results/exp009_predictions.csv"
  
  save_feature_importance: true
  feature_importance_path: "experiments/results/exp009_feature_importance.csv"
